name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: agentcheck samples --profile correct --threshold 100 --output reports/correct.json
      - name: Check installed wheel and bundled fixtures
        shell: bash
        run: |
          python -m venv /tmp/agentcheck-wheel
          /tmp/agentcheck-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/agentcheck-wheel/bin/python -m agentcheck samples --threshold 100
